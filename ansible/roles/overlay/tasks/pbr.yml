---
- name: Configure interface as routed port (PBR Services)
  cisco.nxos.nxos_interfaces:
    config:
      - name: "{{ PBR_interfaces[0].name }}"
        mode: layer3
        enabled: true
        description: "PBR service chaining to firewalls" 
    state: merged

- name: Configure Dot1Q encap for subinterfaces (PBR Services)
  cisco.nxos.nxos_l3_interfaces:
    config:
      - name: "{{ PBR_interfaces[0].name }}.{{ item.vlan_id }}"
        dot1q: "{{ item.vlan_id }}"
    state: merged
  loop: "{{ PBR_services }}"

- name: Assign VRF forwarding for subinterfaces (PBR Services)
  cisco.nxos.nxos_vrf_interfaces:
    config:
      - name: "{{ PBR_interfaces[0].name }}.{{ item.vlan_id }}"
        vrf_name: "{{ item.vrf_name }}"
    state: merged
  loop: "{{ PBR_services }}"

- name: Assign IPv4 addresses for subinterfaces (PBR Services)
  cisco.nxos.nxos_l3_interfaces:
    config:
      - name: "{{ PBR_interfaces[0].name }}.{{ item.vlan_id }}"
        ipv4:
          - address: "{{ item.addr }}"
            ip_network_mask: "{{ item.mask }}"
    state: merged
  loop: "{{ PBR_services }}"

- name: Activate subinterfaces (PBR Services)
  cisco.nxos.nxos_interfaces:
    config:
      - name: "{{ PBR_interfaces[0].name }}.{{ item.vlan_id }}"
        enabled: true
    state: merged
  loop: "{{ PBR_services }}"